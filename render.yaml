# Render Blueprint — deploy AAWARA from this repo in one click:
#   Render Dashboard → New → Blueprint → select this repository.
# Docs: https://render.com/docs/blueprint-spec
services:
  # Primary user-facing app (Flask + waitress, serves the Rudra widget).
  - type: web
    name: aawara-web
    runtime: docker
    plan: starter          # persistent disks require a paid instance
    healthCheckPath: /health
    autoDeploy: true       # every push to main redeploys
    disk:
      name: aawara-data
      mountPath: /app/data # SQLite database lives here — do not remove
      sizeGB: 1
    envVars:
      # Secrets generated by Render on first deploy
      - key: RUN_TOKEN            # pipeline trigger + admin API token
        generateValue: true
      - key: SESSION_SECRET       # cookie signing key
        generateValue: true
      # Provider keys you must set in the dashboard (never commit these)
      - key: GROQ_API_KEY         # Rudra's primary LLM provider
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN   # notifications; optional
        sync: false
      # Set to https://aawara-web.onrender.com once the service exists,
      # then redeploy so canonical/OG/sitemap URLs are correct.
      - key: PUBLIC_BASE_URL
        sync: false
      # TLS terminates at Render's proxy
      - key: COOKIE_SECURE
        value: force
      # Register your account first, set your username here, redeploy
      # to gain the admin role at startup.
      - key: ADMIN_USERNAME
        sync: false

  # Optional read API. Delete this block if you only need the website.
  - type: web
    name: aawara-api
    runtime: docker
    plan: starter
    dockerCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: RUN_TOKEN
        sync: false               # reuse the value Render generated above

# Notes:
# - The n8n scheduler is intentionally not part of this blueprint. Replace
#   it with a Render Cron Job POSTing /run with X-Run-Token twice daily, or
#   keep n8n self-hosted (see docs/DEPLOYMENT.md).
# - SQLite persists on the attached disk. For multi-instance scale-out,
#   migrate to managed PostgreSQL first.
