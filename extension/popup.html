<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aawara Autofill</title>
  <style>
    body { width: 260px; font: 13px/1.5 system-ui, sans-serif; color: #10131a; margin: 0; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 4px 0; }
    button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #5b8cff; color: #fff; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .muted { color: #6b7280; }
    .ok { color: #16a34a; font-weight: 600; }
    a { color: #5b8cff; }
  </style>
</head>
<body>
  <h1>🎯 Aawara Autofill</h1>
  <p class="muted">Fills only empty fields from your Aawara resume.</p>
  <div id="status" class="muted">Not configured yet.</div>
  <button id="fill">Fill this form</button>
  <p><a id="options" href="#">Open options (server + token)</a></p>
  <script src="popup.js"></script>
</body>
</html>
