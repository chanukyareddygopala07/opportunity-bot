{% extends "base.html" %}
{% block title %}OAuth — Aawara{% endblock %}
{% block content %}
  <div class="auth-card">
    <h2 class="section-title">Sign in via provider</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <p class="muted"><a href="{{ url_for('login') }}">Back to login</a> or
      <a href="{{ url_for('register') }}">create an account</a>.</p>
  </div>
{% endblock %}
