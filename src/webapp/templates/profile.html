{% extends "base.html" %}
{% block title %}Profile — Aawara{% endblock %}
{% block content %}
  <h2 class="section-title">Your profile</h2>
  <p class="muted">Match scores, eligibility and the “best matches” feed are
    computed against these fields. Leave a field empty if you don't know it.</p>

  <form method="post" class="form">
    <div class="form-grid">
      <label>Username
        <input name="username_display" value="{{ user.username }}" disabled>
      </label>
      <label>Country
        <input name="country" value="{{ user.country or '' }}" placeholder="India">
      </label>
      <label>Citizenship
        <input name="citizenship" value="{{ user.citizenship or '' }}" placeholder="Indian">
      </label>
      <label>Degree
        <input name="degree" value="{{ user.degree or '' }}" placeholder="B.Tech">
      </label>
      <label>Degree level
        <input name="degree_level" value="{{ user.degree_level or '' }}" placeholder="Undergraduate">
      </label>
      <label>Current year
        <input name="current_year" type="number" min="1" max="6" value="{{ user.current_year or '' }}">
      </label>
      <label>CGPA (0–10)
        <input name="cgpa" type="number" step="0.01" min="0" max="10" value="{{ user.cgpa or '' }}" placeholder="8.2">
      </label>
      <label>Eligible years (comma-separated)
        <input name="eligible_years" value="{{ (user.eligible_years or []) | join(', ') }}">
      </label>
      <label>University
        <input name="university" value="{{ user.university or '' }}">
      </label>
      <label>Branch / major
        <input name="branch" value="{{ user.branch or '' }}" placeholder="Computer Science and Engineering">
      </label>
      <label>Graduation year
        <input name="graduation_year" type="number" min="2020" max="2040" value="{{ user.graduation_year or '' }}">
      </label>
      <label class="wide">Skills (comma-separated)
        <input name="skills" value="{{ (user.skills or []) | join(', ') }}" placeholder="C, C++, Python, DSA">
      </label>
      <label class="wide">Interests (comma-separated)
        <input name="interests" value="{{ (user.interests or []) | join(', ') }}" placeholder="SWE, AI/ML, Research, Quant">
      </label>
    </div>
    <button class="btn btn-primary" type="submit">Save profile</button>
  </form>
{% endblock %}
